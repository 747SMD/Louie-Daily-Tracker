<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Louie">
<meta name="theme-color" content="#27272b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Louie's Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one narrow column, phone first. Photo banner, then day strip, then big activity buttons, then the day's log. */
:root{
  --bg:#f2f3f1; --surface:#ffffff; --ink:#1e1d1c; --muted:#6b6863; --line:#dcdcd7;
  --floor:#a8693a; --floor-soft:#f3e4d6; --wall:#27272b;
  --potty:#b5782f; --feeding:#3d7d4f; --rest:#4b56a8; --medical:#b8423c; --training:#1f7f86; --grooming:#a64f86; --boarding:#5c6470;
  --ok:#3d7d4f; --warn:#b8423c;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161616; --surface:#212121; --ink:#efece8; --muted:#a29e98; --line:#3a3936;
  --floor:#d79a63; --floor-soft:#3b2c20; --wall:#0e0e10;
  --potty:#dca05a; --feeding:#6fbf83; --rest:#8f99e8; --medical:#ec7d75; --training:#5fc1c8; --grooming:#df8dc0; --boarding:#a3abb7;
  --ok:#6fbf83; --warn:#ec7d75; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161616; --surface:#212121; --ink:#efece8; --muted:#a29e98; --line:#3a3936;
  --floor:#d79a63; --floor-soft:#3b2c20; --wall:#0e0e10;
  --potty:#dca05a; --feeding:#6fbf83; --rest:#8f99e8; --medical:#ec7d75; --training:#5fc1c8; --grooming:#df8dc0; --boarding:#a3abb7;
  --ok:#6fbf83; --warn:#ec7d75; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;display:flex;flex-direction:column;gap:18px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--floor);outline-offset:2px}
h2{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:0;text-wrap:balance}
.label{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* banner */
.banner{position:relative;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));aspect-ratio:5/4;max-height:420px;width:auto;background:linear-gradient(180deg,var(--wall) 0 34%,#d9d8d4 34% 66%,var(--floor) 66%);overflow:hidden}
.banner img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.banner::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(180deg,transparent,rgba(12,11,10,.72));pointer-events:none}
.banner .name{z-index:1}
.banner .name{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:12px;display:flex;flex-direction:column;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.55)}
.banner .name b{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1}
.banner .name span{font-size:.9rem;opacity:.92}
.menu-btn{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));background:rgba(20,20,22,.55);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:.9rem;backdrop-filter:blur(6px)}

/* status */
.status{font-size:.9rem;border-radius:10px;padding:10px 12px;background:var(--floor-soft);color:var(--ink)}
.status.err{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}

/* day strip */
.daypick{display:flex;flex-direction:column;gap:10px}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dayhead h2{font-size:1.35rem}
.dayhead .tools{display:flex;gap:8px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.9rem}
.jump{position:relative;overflow:hidden}
.jump input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 8px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.strip::-webkit-scrollbar{display:none}
.day{flex:0 0 58px;scroll-snap-align:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px}
.day small{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.day b{font-family:var(--display);font-size:1.35rem;line-height:1.1}
.day i{font-style:normal;font-size:.68rem;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-pressed="true"] small,.day[aria-pressed="true"] i{color:inherit;opacity:.8}
.day.today:not([aria-pressed="true"]){border-color:var(--floor);border-width:2px}

/* summary */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.sum b{display:block;font-family:var(--display);font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.sum span{font-size:.75rem;color:var(--muted);font-weight:700}
.since{font-size:.92rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.since b{color:var(--ink)}

/* activity grid */
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.act{--c:var(--muted);border:0;border-radius:var(--r);padding:16px 14px;text-align:left;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink);display:flex;align-items:center;gap:12px;min-height:68px;border:2px solid transparent}
.act svg{width:30px;height:30px;flex:none;color:var(--c)}
.act b{font-family:var(--display);font-weight:800;font-size:1.2rem}
.act[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 26%,var(--surface))}
.act.wide{grid-column:1/-1;min-height:56px}

/* composer */
.composer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.composer h2{display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{--c:var(--ink);border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:10px 16px;font-weight:700;font-size:1rem}
.chip.big{padding:14px 20px;font-size:1.1rem}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.chip.small{padding:7px 12px;font-size:.88rem;font-weight:400}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.time{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);font-size:1.05rem;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:64px;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);resize:vertical}
.save{border:0;border-radius:12px;background:var(--ink);color:var(--bg);padding:16px;font-weight:700;font-size:1.1rem;width:100%}
.save:disabled{opacity:.45}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 0;font-size:.95rem}
.group{display:flex;flex-direction:column;gap:8px}

/* log */
.log{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:76px 10px 1fr auto;gap:10px;align-items:start;padding:11px 2px;border-bottom:1px solid var(--line)}
.entry .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem;padding-top:1px}
.entry .dot{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:6px}
.entry .what{min-width:0}
.entry .what b{font-weight:700}
.entry .what p{margin:2px 0 0;color:var(--muted);font-size:.92rem;overflow-wrap:anywhere}
.entry .tag{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,transparent);margin-left:6px}
.entry .edit{border:0;background:none;color:var(--muted);font-size:.9rem;padding:2px 4px;text-decoration:underline}
.empty{padding:22px 4px;color:var(--muted);text-align:center}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto}
.sheet .opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px;text-align:left;width:100%}
.sheet .opt span{font-size:.88rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:30;font-weight:700;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,10px);opacity:0}}}
/* tabs + stats */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:color-mix(in srgb,var(--ink) 8%,var(--bg));padding:4px;border-radius:12px}
.tabs button{border:0;background:none;border-radius:9px;padding:10px;font-weight:700;font-size:1rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ranges{display:flex;gap:6px;flex-wrap:wrap}
.ranges .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile b{display:block;font-family:var(--display);font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:.82rem;color:var(--muted);font-weight:700}
.tile small{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{margin:0;font-size:1rem;font-weight:700}
.card p.sub{margin:0;color:var(--muted);font-size:.88rem}
.card svg{width:100%;height:auto;display:block;overflow:visible}
.card svg text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.peaks{font-size:.92rem}.peaks b{font-variant-numeric:tabular-nums}
:root{--pee:#b8860b;--poo:#6b4226;--grid:#e6e6e1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pee:#e0b23a;--poo:#c08a62;--grid:#333230}}
:root[data-theme="dark"]{--pee:#e0b23a;--poo:#c08a62;--grid:#333230}
.tip{position:fixed;z-index:25;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.85rem;padding:6px 9px;border-radius:8px;white-space:nowrap}
.htable{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.htable th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
.htable td{padding:9px 4px;border-bottom:1px solid var(--line)}
.htable tr[data-d]{cursor:pointer}
.htable td.n{text-align:center}.htable th.n{text-align:center}
.scroll{overflow-x:auto}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:70px 1fr 44px;gap:8px;align-items:center;font-size:.9rem}
.bar i{display:block;height:12px;border-radius:0 4px 4px 0;background:var(--poo);min-width:2px}
.bar em{font-style:normal;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
@media (min-width:520px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (min-width:520px){.acts{grid-template-columns:repeat(3,1fr)}.act.wide{grid-column:auto}}
</style>

    <div class="name"><b>Louie</b><span id="subtitle">Daily log</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const ICON={
 Potty:'<svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="16" rx="5" ry="4.2"/><circle cx="6" cy="10" r="2.1"/><circle cx="10" cy="6.5" r="2.1"/><circle cx="14" cy="6.5" r="2.1"/><circle cx="18" cy="10" r="2.1"/></svg>',
 Feeding:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 12h20a10 6 0 0 1-20 0z"/><rect x="5" y="9" width="14" height="2" rx="1"/></svg>',
 Rest:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4a8.5 8.5 0 1 0 11.5 11.5z"/></svg>',
 Medical:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="8" width="18" height="8" rx="4" transform="rotate(-35 12 12)"/></svg>',
 Training:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.2 6.8.8-5 4.6 1.4 6.7L12 16.9 5.9 20.3l1.4-6.7-5-4.6 6.8-.8z"/></svg>',
 Grooming:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16v4H4z"/><path d="M5 8h2v11H5zm4 0h2v11H9zm4 0h2v11h-2zm4 0h2v11h-2z"/></svg>',
 Boarding:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>'
};
const ACTS={
 Potty:{c:'--potty',opts:['Pee','Poo','Pee & Poo']},
 Feeding:{c:'--feeding',opts:['Kibble','Chicken mix','Turkey mix','Beef cooked','Raw beef mix','Other']},
 Rest:{c:'--rest',opts:['In crate','Awake']},
 Medical:{c:'--medical',opts:['Medication','Vet Visit','Weight Check']},
 Training:{c:'--training',opts:['Obedience','Leash Training','Agility']},
 Grooming:{c:'--grooming',opts:['Nail Trim','Bath']},
 Boarding:{c:'--boarding',opts:['Drop off','Pick up']}
};
const STOOL=['Normal','Soft','Runny','Mucus','Blood'];
const QUICK={
 Potty:['Asked to go out','I took him out','On patio','Tradition Square',"At Mom & Dad's",'At vet'],
 Feeding:['RC Gastro low fat','With meds','Snack','Probiotics'],
 Medical:['Gabapentin','Metronidazole','Cerenia','Simparica Trio','Nexgard & Heartgard'],
 Rest:['Restless',"At Mom & Dad's"],
 Training:[],Grooming:[],Boarding:['Pet St Lucie']
};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const h12=t=>{let [h,m]=t.split(':').map(Number);const ap=h<12?'AM':'PM';h=h%12||12;return h+':'+pad(m)+' '+ap};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const START=parse('2026-01-01');

const state={date:iso(new Date()),act:null,opt:null,stool:null,time:nowHM(),timeTouched:false,note:'',editing:null,month:{},monthKey:null,ready:false,canWrite:true,db:null};
let unsub=null,loadTimer=null;

function toast(msg){const r=$('#toastRoot');r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',2600)}
function status(msg,err){const s=$('#status');s.hidden=!msg;s.textContent=msg||'';s.classList.toggle('err',!!err)}

/* ---------- day strip ---------- */
function buildStrip(){
  const strip=$('#strip'),today=new Date(),end=new Date(today);end.setDate(end.getDate()+3);
  const frag=document.createDocumentFragment();
  for(let d=new Date(START);d<=end;d.setDate(d.getDate()+1)){
    const k=iso(d),b=document.createElement('button');
    b.type='button';b.className='day'+(k===iso(today)?' today':'');b.dataset.d=k;
    b.innerHTML='<small>'+WD[d.getDay()]+'</small><b>'+d.getDate()+'</b><i>'+MONTHS[d.getMonth()].slice(0,3)+'</i>';
    b.setAttribute('aria-label',WD[d.getDay()]+' '+MONTHS[d.getMonth()]+' '+d.getDate());
    frag.appendChild(b);
  }
  strip.appendChild(frag);
  strip.addEventListener('click',e=>{const b=e.target.closest('.day');if(b)selectDate(b.dataset.d)});
  $('#jump').min='2026-01-01';$('#jump').max=iso(end);
}
function centerDay(smooth){const b=$('.day[data-d="'+state.date+'"]');if(!b)return;const s=$('#strip');s.scrollTo({left:b.offsetLeft-s.clientWidth/2+b.offsetWidth/2,behavior:smooth&&!matchMedia('(prefers-reduced-motion:reduce)').matches?'smooth':'auto'})}
function selectDate(k){
  state.date=k;
  document.querySelectorAll('.day[aria-pressed="true"]').forEach(b=>b.setAttribute('aria-pressed','false'));
  const b=$('.day[data-d="'+k+'"]');if(b)b.setAttribute('aria-pressed','true');
  centerDay(true);$('#jump').value=k;
  const d=parse(k),t=iso(new Date());
  const y=new Date();y.setDate(y.getDate()-1);
  $('#dayTitle').textContent=(k===t?'Today, ':k===iso(y)?'Yesterday, ':WD[d.getDay()]+', ')+MONTHS[d.getMonth()]+' '+d.getDate();
  if(!state.timeTouched)state.time=k===t?nowHM():'12:00';
  watchMonth(k.slice(0,7));
  renderDay();renderComposer();
}

/* ---------- data ---------- */
function watchMonth(mk){
  if(!state.db||mk===state.monthKey)return;
  state.monthKey=mk;state.month={};state.ready=false;
  if(unsub)unsub();
  clearTimeout(loadTimer);
  loadTimer=setTimeout(()=>{if(!state.ready)status("Can't reach the saved log yet. Check the connection; it will load on its own once it can.",true)},10000);
  unsub=state.db.doc('months/'+mk).onSnapshot(snap=>{
    if(mk!==state.monthKey)return;
    state.month=(snap.exists&&snap.data().entries)||{};
    if(!snap.metadata.fromCache){state.ready=true;clearTimeout(loadTimer);status('')}
    renderDay();
  },err=>{clearTimeout(loadTimer);state.ready=true;status("The log stopped updating. Reload the page to reconnect.",true);renderDay()});
}
function dayEntries(){
  return Object.entries(state.month).map(([id,e])=>({id,...e})).filter(e=>e.d===state.date&&!e.x).sort((a,b)=>a.t<b.t?-1:a.t>b.t?1:0);
}
async function writeEntry(id,e){
  const mk=e.d.slice(0,7),ref=state.db.doc('months/'+mk);
  try{await ref.update({entries:{[id]:e}})}
  catch(err){
    if(err&&err.code==='invalid_argument'){
      const snap=await ref.get();
      if(snap.exists)throw err;
      await ref.set({month:mk,entries:{[id]:e}});
    }else if(err&&err.code==='unavailable'){
      await new Promise(r=>setTimeout(r,600+Math.random()*900));await ref.update({entries:{[id]:e}});
    }else throw err;
  }
}
function newId(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ---------- render ---------- */
function renderActs(){
  $('#acts').innerHTML=Object.keys(ACTS).map((a,i)=>'<button type="button" class="act'+(a==='Boarding'?' wide':'')+'" data-a="'+a+'" style="--c:var('+ACTS[a].c+')" aria-pressed="'+(state.act===a)+'">'+ICON[a]+'<b>'+a+'</b></button>').join('');
}
function renderDay(){
  const es=dayEntries();
  const pee=es.filter(e=>e.a==='Potty'&&(e.s==='Pee'||e.s==='Pee & Poo')).length;
  const poo=es.filter(e=>e.a==='Potty'&&(e.s==='Poo'||e.s==='Pee & Poo')).length;

async function allEntries(){

async function offer(filename,data){
  try{
    const type=filename.endsWith('.xlsx')?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':filename.endsWith('.csv')?'text/csv':'application/json';
    const blob=new Blob([data],{type});
    const mark=()=>{if(filename.startsWith('Louie Backup'))try{localStorage.setItem('louie.lastBackup',new Date().toISOString())}catch(e){}};
    try{const file=new File([blob],filename,{type});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});mark();toast('Shared '+filename);return}
    }catch(e){if(e&&e.name==='AbortError')return}
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
    if(filename.startsWith('Louie Backup'))try{localStorage.setItem('louie.lastBackup',new Date().toISOString())}catch(e){}
    toast('Saved '+filename);
  }catch(e){status("Couldn't create the file on this phone.",true)}
}

function stoolKind(e){
  if(e.q)return e.q==='Blood'?'Mucus / blood':e.q==='Mucus'?'Mucus / blood':e.q;
  const n=(e.n||'').toLowerCase();if(!n)return null;

  if(/runny|liquid|diarrh|loose|drip/.test(n))return 'Runny';

}
function hourChart(title,list,ndays,color){
  const c=new Array(24).fill(0);list.forEach(e=>c[Math.floor(mins(e.t)/60)]++);
  const avg=c.map(v=>v/ndays),max=Math.max(.05,...avg),W=340,H=120,L=24,B=18,T=8,bw=(W-L)/24;

  avg.forEach((v,h)=>{const x=L+h*bw,yy=y(v);
    s+='<rect x="'+(x+1)+'" y="'+Math.min(yy,H-B-1)+'" width="'+(bw-2)+'" height="'+Math.max(1,H-B-yy)+'" rx="2" fill="'+color+'"/>';
    s+='<rect x="'+x+'" y="'+T+'" width="'+bw+'" height="'+(H-T-B)+'" fill="transparent" data-tip="'+hourLabel(h)+'–'+hourLabel((h+1)%24)+': '+c[h]+' times ('+v.toFixed(2)+' a day)"/>';});
  [0,6,12,18].forEach(h=>s+='<text x="'+(L+h*bw+bw/2)+'" y="'+(H-4)+'" text-anchor="middle">'+(h===0?'12 AM':h===12?'Noon':hourLabel(h))+'</text>');
  s+='</svg>';
  const peaks=c.map((v,h)=>[v,h]).sort((a,b)=>b[0]-a[0]).filter(p=>p[0]>0).slice(0,3).sort((a,b)=>a[1]-b[1]);
  return '<div class="card"><h3>'+title+' by time of day</h3><p class="sub">Bar height shows how often he goes in that hour on an average day.</p>'+s+
    '<div class="peaks">Busiest hours: '+(peaks.map(p=>'<b>'+hourLabel(p[1])+'</b>').join(', ')||'none yet')+'</div></div>';

function trendChart(title,days,key,color){
  const W=340,H=110,L=24,B=18,T=8,n=days.length,bw=(W-L)/Math.max(n,1);
  const max=Math.max(1,...days.map(d=>d[key])),y=v=>T+(H-T-B)*(1-v/max);

  days.forEach((d,i)=>{const x=L+i*bw,yy=y(d[key]),gap=bw>4?1:0;
    s+='<rect x="'+(x+gap/2)+'" y="'+yy+'" width="'+Math.max(.6,bw-gap)+'" height="'+Math.max(0,H-B-yy)+'" fill="'+color+'"/>';
    s+='<rect x="'+x+'" y="'+T+'" width="'+bw+'" height="'+(H-T-B)+'" fill="transparent" data-tip="'+niceDate(d.d)+': '+d[key]+' '+title.toLowerCase()+'"/>';});
  s+='<line x1="'+L+'" x2="'+W+'" y1="'+y(avg)+'" y2="'+y(avg)+'" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/>';

function niceDate(k){const d=parse(k);return MONTHS[d.getMonth()].slice(0,3)+' '+d.getDate()}
function renderStats(){
  const body=$('#statsBody');
  if(!stats.all){body.innerHTML='<div class="empty">Loading Louie\'s history…</div>';return}
  const today=iso(new Date()),byDay={};
  stats.all.forEach(e=>{(byDay[e.d]=byDay[e.d]||[]).push(e)});
  let keys=Object.keys(byDay).filter(k=>k<today).sort();

  if(!keys.length){body.innerHTML='<div class="empty">No full days logged in this range yet.</div>';return}
  const days=keys.map(k=>{
    const es=byDay[k].sort((a,b)=>a.t<b.t?-1:1),pees=es.filter(isPee),poos=es.filter(isPoo);
    const awake=es.find(e=>e.s==='Awake'),crate=es.filter(e=>e.s==='In crate'&&mins(e.t)>=15*60).pop();
    const gaps=[];for(let i=1;i<pees.length;i++){const g=mins(pees[i].t)-mins(pees[i-1].t);if(g>0&&g<=360)gaps.push(g)}
    return{d:k,es,pee:pees.length,poo:poos.length,meals:es.filter(e=>e.a==='Feeding').length,
      wake:awake?mins(awake.t):null,bed:crate?mins(crate.t):null,firstPoo:poos[0]?mins(poos[0].t):null,gaps};
  });
  const n=days.length,avg=k=>(days.reduce((s,d)=>s+d[k],0)/n).toFixed(1);
  const med=k=>median(days.map(d=>d[k]).filter(v=>v!=null));
  const gaps=days.flatMap(d=>d.gaps),gapAvg=gaps.length?gaps.reduce((a,b)=>a+b,0)/gaps.length:null;
  const inRange=days.flatMap(d=>d.es);
  const wake=med('wake'),bed=med('bed'),fp=med('firstPoo');
  const tile=(v,l,s)=>'<div class="tile"><span>'+l+'</span><b>'+v+'</b>'+(s?'<small>'+s+'</small>':'')+'</div>';
  // stool
  const kinds=['Normal','Soft','Runny','Mucus / blood'],kc={};let noted=0;

  const stool=noted?'<div class="card"><h3>What his poo was like</h3><p class="sub">From '+noted+' poos that had a note or rating ('+inRange.filter(isPoo).length+' poos in all).</p><div class="bars">'+

  body.innerHTML='<div class="group" style="gap:12px">'+
    '<p class="sub" style="margin:0;color:var(--muted);font-size:.9rem">'+n+' full days, '+niceDate(keys[0])+' to '+niceDate(keys[n-1])+'. Today is left out until it\'s over.</p>'+
    '<div class="tiles">'+tile(avg('pee'),'Pees a day')+tile(avg('poo'),'Poos a day')+tile(avg('meals'),'Meals a day')+

    trendChart('Pees',days,'pee','var(--pee)')+trendChart('Poos',days,'poo','var(--poo)')+stool+meds+hist+'</div>';
}

  test(){const k='louie.test';localStorage.setItem(k,'1');if(localStorage.getItem(k)!=='1')throw new Error('read-back failed');localStorage.removeItem(k)},
  async load(){return JSON.parse(localStorage.getItem(KEY)||'null')},
  async save(m){localStorage.setItem(KEY,JSON.stringify(m))}};

  let dbp=null;

    if(!window.indexedDB)return rej(new Error('no IndexedDB'));

    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
